name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# actions/checkout and actions/setup-node still ship a Node 20 entrypoint; run them on the
# runner's Node 24 instead of taking the deprecation warning on every build.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite needs Node 22+ (zstd in node:zlib, native ESM test runner behaviour).
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No dependencies to install: the package is peer-provided by DSH and uses only
      # Node built-ins. The suite is fully offline — it spins up scripted IMAP/SMTP
      # servers over real TLS with a certificate generated inside the test process.
      - run: npm test
